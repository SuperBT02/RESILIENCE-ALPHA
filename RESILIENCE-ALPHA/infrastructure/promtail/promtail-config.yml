server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://resilience_loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Label `service` = container name without the resilience_ prefix.
      - source_labels: ["__meta_docker_container_name"]
        regex: "/resilience_(.*)"
        target_label: service
    pipeline_stages:
      - docker: {}
