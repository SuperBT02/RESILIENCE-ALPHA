<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RESILIENCE-ALPHA — Payment</title>
<style>
  :root { --ink:#261E48; --bg:#E4E6F3; --panel:#fff; --accent:#4B3FA8; --line:#C9CCE6; }
  * { box-sizing:border-box; font-family:system-ui,Segoe UI,sans-serif; }
  body { margin:0; background:var(--bg); color:var(--ink); display:grid; place-items:center; min-height:100vh; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:28px; width:min(420px,92vw); }
  h1 { font-size:20px; margin:0 0 16px; }
  label { display:block; font-size:13px; font-weight:600; margin:12px 0 4px; }
  input { width:100%; padding:10px; border:1px solid var(--line); border-radius:8px; font-size:15px; }
  button { width:100%; margin-top:18px; padding:11px; border:0; border-radius:8px; background:var(--accent); color:#fff; font-weight:700; cursor:pointer; }
  .out { margin-top:16px; font-size:14px; min-height:20px; }
  .ok { color:#1D7A46; } .err { color:#C23A34; }
</style>
</head>
<body>
  <div class="card">
    <h1>Payment platform — RESILIENCE-ALPHA</h1>
    <label>Username</label>
    <input id="user" value="alice_merchant">
    <label>Password</label>
    <input id="pass" type="password" value="alice-demo-2026">
    <button onclick="login()">Log in</button>
    <div id="account" style="display:none">
      <button onclick="pay()">Send a test payment</button>
    </div>
    <div class="out" id="out"></div>
  </div>
<script>
let token = null;
const out = (m, c="") => document.getElementById("out").innerHTML = `<span class="${c}">${m}</span>`;
async function login() {
  try {
    const r = await fetch("/auth/login", { method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ username: user.value, password: pass.value }) });
    if (!r.ok) return out("Login refused.", "err");
    token = (await r.json()).access_token;
    document.getElementById("account").style.display = "block";
    out("Logged in.", "ok");
  } catch (e) { out("Service unavailable.", "err"); }
}
async function pay() {
  try {
    const r = await fetch("/api/payments/test", { method:"POST" });
    const b = await r.json();
    out(r.ok && b.ok ? "Payment OK (tx " + b.tx_id + ")" : "Payment failed", r.ok && b.ok ? "ok" : "err");
  } catch (e) { out("Service unavailable.", "err"); }
}
</script>
</body>
</html>
