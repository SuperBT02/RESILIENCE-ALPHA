<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RESILIENCE-ALPHA — Supervision</title>
<style>
  :root { --bg:#15122A; --panel:#1E1A38; --line:#36305E; --muted:#A7A3C8; }
  * { box-sizing:border-box; font-family:system-ui,Segoe UI,sans-serif; }
  body { margin:0; background:var(--bg); color:#ECEBF8; padding:24px; }
  h1 { font-size:18px; letter-spacing:.04em; color:var(--muted); text-transform:uppercase; margin:0 0 16px; }
  .banner { border-radius:16px; padding:34px; text-align:center; transition:background .3s; }
  .banner h2 { font-size:38px; margin:0; } .banner p { font-size:16px; margin:8px 0 0; opacity:.9; }
  .state-ok { background:linear-gradient(135deg,#1f8a4c,#2ecc71); }
  .state-attack { background:linear-gradient(135deg,#a33027,#e74c3c); }
  .state-fix { background:linear-gradient(135deg,#9a6410,#f39c12); }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px; margin-top:18px; }
  .tile { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; }
  .tile .k { font-size:12px; color:var(--muted); text-transform:uppercase; }
  .tile .v { font-size:28px; font-weight:700; margin-top:6px; }
  .steps { margin-top:18px; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; }
  .step { display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--line); font-size:14px; }
</style>
</head>
<body>
  <h1>PROJECT RESILIENCE-ALPHA — live supervision</h1>
  <div class="banner state-ok" id="banner">
    <h2 id="title">Service operational</h2>
    <p id="subtitle">Waiting for data…</p>
  </div>
  <div class="grid">
    <div class="tile"><div class="k">Test transaction</div><div class="v" id="tx">—</div></div>
    <div class="tile"><div class="k">Last incident</div><div class="v" id="itype" style="font-size:20px">—</div></div>
    <div class="tile"><div class="k">Recovery time</div><div class="v" id="rec">—</div></div>
  </div>
  <div class="steps"><div id="timeline"><div class="step"><span>No incident yet.</span></div></div></div>
<script>
async function tick() {
  let s; try { s = await (await fetch("/api/state")).json(); } catch (e) { return; }
  const banner = document.getElementById("banner"), title = document.getElementById("title"), sub = document.getElementById("subtitle");
  const inc = s.incident, active = inc && inc.status === "in_progress", recovered = inc && inc.status === "recovered";
  if (active) { banner.className = "banner state-fix"; title.textContent = "Remediation in progress…"; sub.textContent = "Incident: " + (inc.type||"?"); }
  else if (inc && inc.status === "detected") { banner.className = "banner state-attack"; title.textContent = "Attack detected: " + (inc.type||"?"); sub.textContent = "Source: " + (inc.source_ip||"?"); }
  else if (s.payment_ok) { banner.className = "banner state-ok"; title.textContent = "Service operational"; sub.textContent = recovered ? "Recovered — transaction verified" : "Nominal transactions"; }
  else { banner.className = "banner state-attack"; title.textContent = "Service degraded"; sub.textContent = "Test transaction failing"; }
  document.getElementById("tx").textContent = s.payment_ok ? "success" : "failed";
  document.getElementById("tx").style.color = s.payment_ok ? "#2ecc71" : "#e74c3c";
  document.getElementById("itype").textContent = inc ? (inc.type||"—") : "—";
  document.getElementById("rec").textContent = inc && inc.duration_ms ? (inc.duration_ms/1000).toFixed(1)+" s" : "—";
  const tl = document.getElementById("timeline");
  if (inc && inc.actions && inc.actions.length)
    tl.innerHTML = inc.actions.map(a => `<div class="step"><span>${a.action}</span><span>${a.status}</span></div>`).join("");
}
setInterval(tick, 2000); tick();
</script>
</body>
</html>
