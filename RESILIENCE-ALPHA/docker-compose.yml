# RESILIENCE-ALPHA — full stack.
# Run from the repo root:  docker compose up -d --build
# Single public entry point: the WAF (port 80). Service ports are also published
# for debugging. Internal loop: attack -> Prometheus -> ML -> remediation -> test.

services:

  # ---------------- Database ----------------
  postgres_db:
    image: postgres:15-alpine
    container_name: resilience_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-resilience_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-super_secure_password_change_me}
      POSTGRES_DB: ${DB_NAME:-payment_si}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - resilience_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-resilience_admin} -d ${DB_NAME:-payment_si}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------- Application services ----------------
  auth_service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: resilience_auth
    restart: always
    environment:
      - PORT=8001
      - DB_HOST=resilience_db
      - DB_PORT=5432
      - DB_USER=${DB_USER:-resilience_admin}
      - DB_PASSWORD=${DB_PASSWORD:-super_secure_password_change_me}
      - DB_NAME=${DB_NAME:-payment_si}
      - JWT_SECRET=${JWT_SECRET:-change_me_random_secret}
    ports:
      - "8001:8001"
    depends_on:
      postgres_db:
        condition: service_healthy
    networks:
      - resilience_net

  payment_service:
    build:
      context: ./services/payment-service
      dockerfile: Dockerfile
    container_name: resilience_payment
    restart: always
    environment:
      - DB_HOST=resilience_db
      - DB_PORT=5432
      - DB_USER=${DB_USER:-resilience_admin}
      - DB_PASSWORD=${DB_PASSWORD:-super_secure_password_change_me}
      - DB_NAME=${DB_NAME:-payment_si}
      - PORT=8002
    ports:
      - "8002:8002"
    depends_on:
      postgres_db:
        condition: service_healthy
    networks:
      - resilience_net

  remediation_service:
    build:
      context: ./services/remediation-service
      dockerfile: Dockerfile
    container_name: resilience_remediation
    restart: always
    environment:
      - PAYMENT_URL=http://resilience_payment:8002
      - PAYMENT_CONTAINER=resilience_payment
      - AUTH_CONTAINER=resilience_auth
      - WAF_BLOCKLIST_PATH=/shared/blocklist.conf
    ports:
      - "8003:8003"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - waf_shared:/shared
    networks:
      - resilience_net

  # ---------------- ML engine (anomaly detection) ----------------
  ml_engine:
    build:
      context: ./ml_engine
      dockerfile: Dockerfile
    container_name: resilience_ml
    restart: always
    environment:
      - PROMETHEUS_URL=http://resilience_prometheus:9090/api/v1/query
      - REMEDIATION_WEBHOOK=http://resilience_remediation:8003/remediate
    depends_on:
      - prometheus
      - remediation_service
    networks:
      - resilience_net

  # ---------------- Frontend & dashboard ----------------
  frontend_service:
    build:
      context: ./services/frontend-service
      dockerfile: Dockerfile
    container_name: resilience_frontend
    restart: always
    networks:
      - resilience_net

  dashboard_service:
    build:
      context: ./services/dashboard-service
      dockerfile: Dockerfile
    container_name: resilience_dashboard
    restart: always
    environment:
      - PAYMENT_URL=http://resilience_payment:8002
      - REMEDIATION_URL=http://resilience_remediation:8003
    ports:
      - "8090:8090"
    networks:
      - resilience_net

  # ---------------- Normal traffic generator ----------------
  traffic_generator:
    build:
      context: ./services/traffic-generator
      dockerfile: Dockerfile
    container_name: resilience_traffic
    restart: always
    environment:
      - TARGET_URL=http://resilience_waf:8080
    depends_on:
      - waf
    networks:
      - resilience_net

  # ---------------- WAF (single entry point) ----------------
  waf:
    image: owasp/modsecurity-crs:nginx-alpine
    container_name: resilience_waf
    restart: always
    depends_on:
      - auth_service
      - payment_service
      - frontend_service
    environment:
      BACKEND_AUTH: "http://resilience_auth:8001"
      BACKEND_PAYMENT: "http://resilience_payment:8002"
      BACKEND_FRONT: "http://resilience_frontend:80"
    ports:
      - "80:8080"
    volumes:
      - ./infrastructure/waf/default.conf.template:/etc/nginx/templates/conf.d/default.conf.template:ro
      - waf_shared:/shared
    networks:
      - resilience_net

  # ---------------- Observability ----------------
  prometheus:
    image: prom/prometheus:latest
    container_name: resilience_prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - resilience_net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: resilience_cadvisor
    restart: always
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - resilience_net

  loki:
    image: grafana/loki:3.2.1
    container_name: resilience_loki
    restart: always
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./infrastructure/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
    networks:
      - resilience_net

  promtail:
    image: grafana/promtail:3.2.1
    container_name: resilience_promtail
    restart: always
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./infrastructure/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - resilience_net

  grafana:
    image: grafana/grafana:latest
    container_name: resilience_grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-resilience_password}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    networks:
      - resilience_net
    depends_on:
      - prometheus
      - loki

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  waf_shared:

networks:
  resilience_net:
    driver: bridge
